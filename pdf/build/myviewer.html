<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>PDF Минималистичный просмотр</title>
  <style>
    body {
      background: #fff;
      margin: 0;
      font-family: sans-serif;
    }
    #pdf-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      padding: 16px 0;
      background: #fff;
    }
    .pdf-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #f0f0f0;
      box-shadow: 0 2px 8px #0001;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .pdf-btn:hover {
      background: #e0e0e0;
    }
    #pdf-canvas {
      display: block;
      margin: 0 auto;
      box-shadow: 0 4px 32px #0002;
      background: #fff;
    }
    #page-num {
      font-size: 17px;
      color: #888;
      margin: 0 12px;
    }
  </style>
</head>
<body>
  <div id="pdf-controls">
    <button class="pdf-btn" id="prev" title="Назад">‹</button>
    <span id="page-num">1 / 1</span>
    <button class="pdf-btn" id="next" title="Вперед">›</button>
    <button class="pdf-btn" id="zoom-out" title="Уменьшить">-</button>
    <button class="pdf-btn" id="zoom-in" title="Увеличить">+</button>
    <button class="pdf-btn" id="download" title="Скачать">↓</button>
  </div>
  <canvas id="pdf-canvas"></canvas>

  <!-- PDF.js подключение -->
  <script src="pdf.mjs"></script>
  <script src="pdf.worker.mjs"></script>
  <script>
    // Читаем ссылку на файл из адресной строки
    function getPDFFile() {
      const params = new URLSearchParams(window.location.search);
      return params.get('file') || 'sample.pdf';
    }
    const url = getPDFFile();

    let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null, scale = 1.1;
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');

    // Загрузка PDF
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.js';
    pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
      pdfDoc = pdfDoc_;
      document.getElementById('page-num').textContent = `${pageNum} / ${pdfDoc.numPages}`;
      renderPage(pageNum);
    });

    function renderPage(num) {
      pageRendering = true;
      pdfDoc.getPage(num).then(function(page) {
        const viewport = page.getViewport({ scale: scale });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        // Рендерим страницу
        const renderContext = { canvasContext: ctx, viewport: viewport };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(function() {
          pageRendering = false;
          document.getElementById('page-num').textContent = `${pageNum} / ${pdfDoc.numPages}`;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
    }

    function queueRenderPage(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    // Кнопки
    document.getElementById('prev').onclick = function() {
      if (pageNum <= 1) return;
      pageNum--;
      queueRenderPage(pageNum);
    };
    document.getElementById('next').onclick = function() {
      if (pageNum >= pdfDoc.numPages) return;
      pageNum++;
      queueRenderPage(pageNum);
    };
    document.getElementById('zoom-in').onclick = function() {
      scale += 0.15; queueRenderPage(pageNum);
    };
    document.getElementById('zoom-out').onclick = function() {
      if (scale > 0.4) scale -= 0.15;
      queueRenderPage(pageNum);
    };
    document.getElementById('download').onclick = function() {
      const a = document.createElement('a');
      a.href = url;
      a.download = url.split('/').pop();
      a.click();
    };

    // Листание стрелками клавиатуры
    document.addEventListener('keydown', function(e){
      if(e.key === "ArrowLeft") document.getElementById('prev').click();
      if(e.key === "ArrowRight") document.getElementById('next').click();
      if(e.key === "+") document.getElementById('zoom-in').click();
      if(e.key === "-") document.getElementById('zoom-out').click();
    });
  </script>
</body>
</html>
